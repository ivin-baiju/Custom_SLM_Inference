      .pill-2 { animation: badgeGlow2 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .pill-3 { animation: badgeGlow3 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .pill-4 { animation: badgeGlow4 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .pill-5 { animation: badgeGlow5 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
