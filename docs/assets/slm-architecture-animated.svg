<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="410" role="img" aria-label="Animated 6-Stage Autoregressive GQA &amp; Zero-Copy Safetensors Execution Pipeline">
  <defs>
    <linearGradient id="panelSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="memBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0D9488"/>
