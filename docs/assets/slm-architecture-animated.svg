      @keyframes stageHighlight3 { 0%, 33% { stroke: #D4DFED; stroke-width: 1.2; } 34%, 50% { stroke: #4F46E5; stroke-width: 2.2; } 51%, 100% { stroke: #D4DFED; stroke-width: 1.2; } }
      @keyframes stageHighlight4 { 0%, 50% { stroke: #D4DFED; stroke-width: 1.2; } 51%, 67% { stroke: #2563EB; stroke-width: 2.2; } 68%, 100% { stroke: #D4DFED; stroke-width: 1.2; } }
      @keyframes stageHighlight5 { 0%, 67% { stroke: #D4DFED; stroke-width: 1.2; } 68%, 84% { stroke: #0D9488; stroke-width: 2.2; } 85%, 100% { stroke: #D4DFED; stroke-width: 1.2; } }
      @keyframes stageHighlight6 { 0%, 84% { stroke: #D4DFED; stroke-width: 1.2; } 85%, 100% { stroke: #059669; stroke-width: 2.2; } }

      @keyframes badgeGlow1 { 0%, 16% { fill: #2563EB; } 17%, 100% { fill: #E6ECF4; } }
      @keyframes badgeGlow2 { 0%, 16% { fill: #E6ECF4; } 17%, 33% { fill: #2563EB; } 34%, 100% { fill: #E6ECF4; } }
      @keyframes badgeGlow3 { 0%, 33% { fill: #E6ECF4; } 34%, 50% { fill: #4F46E5; } 51%, 100% { fill: #E6ECF4; } }
      @keyframes badgeGlow4 { 0%, 50% { fill: #E6ECF4; } 51%, 67% { fill: #2563EB; } 68%, 100% { fill: #E6ECF4; } }
      @keyframes badgeGlow5 { 0%, 67% { fill: #E6ECF4; } 68%, 84% { fill: #0D9488; } 85%, 100% { fill: #E6ECF4; } }
      @keyframes badgeGlow6 { 0%, 84% { fill: #E6ECF4; } 85%, 100% { fill: #059669; } }

      .card-1 { animation: stageHighlight1 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .card-2 { animation: stageHighlight2 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .card-3 { animation: stageHighlight3 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .card-4 { animation: stageHighlight4 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .card-5 { animation: stageHighlight5 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      .card-6 { animation: stageHighlight6 6s cubic-bezier(0.23, 1, 0.32, 1) infinite; }

