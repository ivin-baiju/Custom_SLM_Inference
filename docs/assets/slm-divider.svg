<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" role="presentation">
  <defs>
    <linearGradient id="euvTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4DFED" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#0D9488" stop-opacity="0.75"/>
